<polygon points="114,821 109,813 119,813" fill="#FFB74D" opacity="0.7"/>
<rect x="80" y="655" width="740" height="138" rx="16" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#1E2A5E" stroke-width="1"/>
<rect x="80" y="671" width="5" height="106" rx="3" fill="#FFB74D" opacity="0.9"/>
<circle cx="126" cy="724" r="28" fill="#0D1B3E" stroke="#FFB74D" stroke-width="2.5"/>
<text x="126" y="731" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#FFB74D">04</text>
<text x="176" y="701" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Collect Data</text>
<text x="176" y="727" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Let the test run for at least</text>
<text x="176" y="749" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">2 weeks to gather reliable data.</text>
<circle cx="796" cy="675" r="4" fill="#FFB74D" opacity="0.3"/>
<circle cx="782" cy="675" r="4" fill="#FFB74D" opacity="0.5"/>
<circle cx="768" cy="675" r="4" fill="#FFB74D" opacity="0.7"/>
