<circle cx="126" cy="884" r="28" fill="#0D1B3E" stroke="#00E5A0" stroke-width="2.5"/>
<text x="126" y="891" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#00E5A0">05</text>
<text x="176" y="861" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Analyze &amp; Act</text>
<text x="176" y="887" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Use statistical significance</text>
<text x="176" y="909" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">to pick the winner — then scale it.</text>
<circle cx="796" cy="835" r="4" fill="#00E5A0" opacity="0.3"/>
