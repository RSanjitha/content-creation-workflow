<circle cx="126" cy="244" r="28" fill="#0D1B3E" stroke="#00E5A0" stroke-width="2.5"/>
<text x="126" y="251" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#00E5A0">01</text>
<text x="176" y="221" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Set a Goal</text>
<text x="176" y="247" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Define what success looks like</text>
<text x="176" y="269" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">before you touch a single pixel.</text>
<circle cx="796" cy="195" r="4" fill="#00E5A0" opacity="0.3"/>
<circle cx="782" cy="195" r="4" fill="#00E5A0" opacity="0.5"/>
<circle cx="768" cy="195" r="4" fill="#00E5A0" opacity="0.7"/>
<line x1="114" y1="473" x2="114" y2="495" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4,3" opacity="0.5" filter="url(#connGlow)"/>
<polygon points="114,501 109,493 119,493" fill="#4FC3F7" opacity="0.7"/>
<rect x="80" y="335" width="740" height="138" rx="16" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#1E2A5E" stroke-width="1"/>
<rect x="80" y="351" width="5" height="106" rx="3" fill="#4FC3F7" opacity="0.9"/>
<circle cx="126" cy="404" r="28" fill="#0D1B3E" stroke="#4FC3F7" stroke-width="2.5"/>
<text x="126" y="411" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#4FC3F7">02</text>
<text x="176" y="381" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Create Variants</text>
<text x="176" y="407" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Build Version A and Version B.</text>
<text x="176" y="429" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Change only one element per test.</text>
<circle cx="796" cy="355" r="4" fill="#4FC3F7" opacity="0.3"/>
<circle cx="782" cy="355" r="4" fill="#4FC3F7" opacity="0.5"/>
<circle cx="768" cy="355" r="4" fill="#4FC3F7" opacity="0.7"/>
<line x1="114" y1="633" x2="114" y2="655" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4,3" opacity="0.5" filter="url(#connGlow)"/>
<polygon points="114,661 109,653 119,653" fill="#CE93D8" opacity="0.7"/>
<rect x="80" y="495" width="740" height="138" rx="16" fill="url(#cardGrad)" filter="url(#cardShadow)" stroke="#1E2A5E" stroke-width="1"/>
<rect x="80" y="511" width="5" height="106" rx="3" fill="#CE93D8" opacity="0.9"/>
<circle cx="126" cy="564" r="28" fill="#0D1B3E" stroke="#CE93D8" stroke-width="2.5"/>
<text x="126" y="571" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="900" fill="#CE93D8">03</text>
<text x="176" y="541" font-family="Arial,sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Split Traffic</text>
<text x="176" y="567" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">Divide your audience 50/50</text>
<text x="176" y="589" font-family="Arial,sans-serif" font-size="14" fill="#B0BEC5">across both ad versions simultaneously.</text>
<circle cx="796" cy="515" r="4" fill="#CE93D8" opacity="0.3"/>
<circle cx="782" cy="515" r="4" fill="#CE93D8" opacity="0.5"/>
<circle cx="768" cy="515" r="4" fill="#CE93D8" opacity="0.7"/>
