<text x="450" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="900" fill="url(#titleGrad)" filter="url(#softGlow)">How A/B Testing Works</text>
<text x="450" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#B0BEC5">5 steps from hypothesis to winning ad</text>
<rect x="350" y="145" width="200" height="3" rx="2" fill="url(#accentGrad)"/>
